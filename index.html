<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B2834">
<title>WineDrop</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header>
  <div class="brandrow">
    <span id="appName"><svg class="logo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10l-1.2 6.5a4 4 0 0 1-7.6 0L7 3z"/><path d="M12 15.5V21M8.5 21h7"/></svg>WineDrop</span>
    <div class="hdr-actions">
      <button id="bellBtn" class="bell" hidden aria-label="Notifications"></button>
      <select id="langSel" aria-label="Language"></select>
    </div>
  </div>
  <p id="tagline">New wine releases, worldwide</p>
  <div class="controls" id="marketControl">
    <select id="marketSel" aria-label="Market"></select>
  </div>
</header>

<p id="offline" hidden></p>

<main>
  <!-- SENASTE -->
  <section id="latestView">
    <p id="sub"></p>
    <div id="latestSort" class="segbar"></div>
    <div id="list"></div>
  </section>

  <!-- UTFORSKA -->
  <section id="exploreView" hidden>
    <div id="marketChips" class="chips"></div>
    <input id="fSearch" class="search" type="search" autocomplete="off" />
    <div class="filterbar">
      <select id="fType" aria-label="Type"></select>
      <select id="fCountry" aria-label="Country"></select>
      <select id="fSort" aria-label="Sort"></select>
    </div>
    <p id="exploreCount" class="subcount"></p>
    <div id="exploreList"></div>
  </section>

  <!-- TRENDER -->
  <section id="trendsView" hidden>
    <div id="trendsBody"></div>
  </section>

  <!-- DETALJ (delas av alla listor) -->
  <section id="detailView" class="detail" hidden>
    <div id="detailBody"></div>
  </section>
</main>

<nav id="tabbar">
  <button data-tab="latest" class="tab active"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v3.2a3 3 0 0 1-.7 1.9L8 9.6a3.5 3.5 0 0 0-.8 2.2V19a2 2 0 0 0 2 2h5.6a2 2 0 0 0 2-2v-7.2a3.5 3.5 0 0 0-.8-2.2l-1.3-1.5a3 3 0 0 1-.7-1.9V3"/><path d="M7.2 13h9.6"/></svg></span><b id="tabLatest">Latest</b></button>
  <button data-tab="explore" class="tab"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4l-2 5.2-5.2 2 2-5.2 5.2-2z"/></svg></span><b id="tabExplore">Explore</b></button>
  <button data-tab="trends" class="tab"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16"/><path d="M7 14.5l4-4 3 3 5-6"/></svg></span><b id="tabTrends">Trends</b></button>
</nav>

<script src="./i18n.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
<script src="./push.js"></script>
</body>
</html>
